name: auth_engine
description: An auth state machine for Flutter + Firebase apps, with its Firebase gateways and flows.
version: 0.4.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0
  signals_flutter: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
